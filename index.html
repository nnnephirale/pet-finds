<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Finds</title>
<script>/* phone column count (1/2/3) before first paint */
try { document.documentElement.dataset.cols = localStorage.getItem('petfinds_cols') || '2'; }
catch (e) { document.documentElement.dataset.cols = '2'; }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #404040;
  --ink-2: rgba(64,64,64,.45);
  --line: rgba(0,0,0,.05);
  --tile: #EFEFEF;
  --card: rgba(255,255,255,.72);
  --bg-a: #FCFCFC; --bg-b: #F4F4F4;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --kr: "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #E6E6E6; --ink-2: rgba(230,230,230,.45); --line: rgba(255,255,255,.07);
    --tile: #232323; --card: rgba(30,30,30,.72); --bg-a: #181818; --bg-b: #121212;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg-b); }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  background: linear-gradient(180deg, var(--bg-a), var(--bg-b)) fixed;
  font: 300 14px/22px var(--mono); letter-spacing: .01em;
  -webkit-font-smoothing: antialiased;
}
header {
  position: fixed; inset: 0 0 auto 0; z-index: 5;
  display: flex; align-items: center; gap: 20px;
  padding: 18px max(16px, calc((100vw - 1180px) / 2));
  background: color-mix(in srgb, var(--bg-a) 72%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  transition: transform .5s var(--ease);
}
header.hide { transform: translateY(calc(-100% - 2px)); }
h1 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: .04em; }
.count { color: var(--ink-2); }
.spent { margin-left: auto; flex: none; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.cost { color: var(--ink-2); }
input[type=search] {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  font: inherit; color: var(--ink-2); transition: color .3s var(--ease);
}
input[type=search]:focus { color: var(--ink); }
input[type=search]::placeholder { color: var(--ink-2); }
/* The row under the header: [tag pill | search tags]  [search all finds] */
nav.cats {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 30px;
  padding: 92px max(16px, calc((100vw - 1180px) / 2)) 0;
  font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
}
.tagbox {
  flex: none; display: inline-flex; align-items: center; border-radius: 999px;
  background: var(--tile);
}
.tagbox[hidden] { display: none; }
#catpill { display: inline-flex; align-items: center; }
#catpill:empty { display: none; }
#tagq {
  flex: none; width: 122px; padding: 6px 16px 6px 12px; cursor: pointer;
  border-left: 1px solid var(--line); border-radius: 0 999px 999px 0;
  font-size: 12px; letter-spacing: .02em; text-transform: none;
  transition: color .3s var(--ease);
}
#tagq:hover { color: var(--ink); }
#tagq::-webkit-search-cancel-button, #q::-webkit-search-cancel-button { display: none; }
#q {
  flex: 1 1 240px; padding: 6px 16px; border-radius: 999px; background: var(--tile);
  font-size: 13px; letter-spacing: .01em; text-transform: none;
  transition: color .3s var(--ease), background .3s var(--ease), box-shadow .3s var(--ease);
}
#q:focus { background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 0 4px 16px rgba(0,0,0,.07); }
:where(nav.cats button) { all: unset; cursor: pointer; white-space: nowrap; }
.cat-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
  border-radius: 999px; background: var(--tile); color: var(--ink);
  transition: background .25s var(--ease), transform .2s var(--ease);
}
.cat-btn:active { transform: scale(.98); }
.cat-btn .n, .tchip .n { color: var(--ink-2); }
.cat-btn .chev { color: var(--ink-2); font-size: 10px; }
.cat-clear { color: var(--ink-2); font-size: 14px; padding: 4px; transition: color .25s var(--ease); }
.cat-clear:hover { color: var(--ink); }
/* Tag navigation: a modal, not a sideways strip */
.modal {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: start center;
  padding: 14vh 16px 16px; background: rgba(0,0,0,0);
  transition: background .4s var(--ease), backdrop-filter .4s var(--ease), -webkit-backdrop-filter .4s var(--ease);
}
.modal[hidden] { display: none; }
.modal.open { background: rgba(0,0,0,.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.sheet {
  width: min(560px, 100%); max-height: 72vh; display: flex; flex-direction: column; gap: 14px;
  padding: 18px 18px 20px; border-radius: 24px; background: var(--bg-a);
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.12), 0 40px 80px rgba(0,0,0,.18);
  opacity: 0; transform: translateY(10px) scale(.98);
  transition: opacity .3s var(--ease), transform .5s var(--ease);
}
.modal.open .sheet { opacity: 1; transform: none; }
.sheet input {
  all: unset; padding: 8px 14px; border-radius: 999px; background: var(--tile);
  font-size: 13px; color: var(--ink-2); transition: color .25s var(--ease);
}
.sheet input:focus { color: var(--ink); }
.sheet input::placeholder { color: var(--ink-2); }
.tlist { overflow-y: auto; display: flex; flex-direction: column; gap: 14px; margin: 0 -4px; padding: 0 4px; }
.tgroup { display: flex; flex-direction: column; gap: 8px; }
.tchips { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip {
  all: unset; cursor: pointer; display: inline-flex; gap: 6px; padding: 4px 12px;
  border-radius: 999px; background: var(--tile); font-size: 12px; line-height: 18px;
  color: var(--ink-2); transition: color .25s var(--ease), box-shadow .25s var(--ease), transform .2s var(--ease);
}
.tchip:hover { color: var(--ink); }
.tchip:active { transform: scale(.98); }
.tchip.on { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tchip { position: relative; transition: color .25s var(--ease), box-shadow .3s var(--ease), scale .3s var(--ease), transform .2s var(--ease); }
.tchip.dragging {
  z-index: 1; scale: 1.06; color: var(--ink); background: var(--bg-a);
  box-shadow: inset 0 0 0 1px var(--line), 0 6px 18px rgba(0,0,0,.14);
}
html.sorting, html.sorting * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.thead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.t-az {
  all: unset; cursor: pointer; font-size: 11px; letter-spacing: .06em; color: var(--ink-2);
  opacity: 0; transition: opacity .25s var(--ease), color .25s var(--ease);
}
.t-az:hover { color: var(--ink); }
.tgroup:hover .t-az, .t-az:focus-visible { opacity: 1; }
@media (hover: none) { .t-az { opacity: 1; } }
.tnone { color: var(--ink-2); font-size: 13px; }
main {
  display: grid; gap: 28px 22px;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  padding: 28px max(16px, calc((100vw - 1180px) / 2)) 80px;
}
.find {
  border-radius: 20px; background: var(--card); border: 1px solid var(--line);
  overflow: hidden; display: flex; flex-direction: column;
  transition: transform .5s var(--ease), background .3s var(--ease);
  animation: rise .7s var(--ease) both;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (hover: hover) { .find:hover { transform: translateY(-3px); } }
.shot { aspect-ratio: 16/9; background: var(--tile); display: block; width: 100%; object-fit: contain; }
.find { position: relative; }
.edit-btn {
  all: unset; position: absolute; top: 12px; right: 12px; z-index: 2; cursor: pointer;
  padding: 5px 12px; border-radius: 999px; font-size: 12px; color: var(--ink);
  background: color-mix(in srgb, var(--bg-a) 78%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  opacity: 0; transform: translateY(-4px);
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.edit-btn:active { transform: scale(.98); }
@media (hover: hover) { .find:hover .edit-btn { opacity: 1; transform: none; } }
@media (hover: none) { .edit-btn { opacity: 1; transform: none; } }
.find.editing .edit-btn { opacity: 1; transform: none; }
body:not(.can-edit) .edit-btn { display: none; }
/* Star: filled for everyone once set; the outline shows on hover to whoever can edit */
.star {
  all: unset; position: absolute; top: 12px; left: 12px; z-index: 2; cursor: pointer;
  width: 28px; height: 28px; display: grid; place-items: center; border-radius: 999px;
  color: var(--ink); background: color-mix(in srgb, var(--bg-a) 78%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  opacity: 0; transform: translateY(-4px);
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.star svg { fill: transparent; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round;
  transition: fill .3s var(--ease), transform .45s var(--ease); }
.star.on svg { fill: currentColor; }
.star.on { opacity: 1; transform: none; }
.star:active svg { transform: scale(.82); }
@media (hover: hover) { body.can-edit .find:hover .star { opacity: 1; transform: none; } }
@media (hover: none) { body.can-edit .star { opacity: 1; transform: none; } }
body:not(.can-edit) .star:not(.on) { display: none; }
body:not(.can-edit) .star { pointer-events: none; }
[data-k], [data-p] { outline: none; border-radius: 6px; transition: background .25s var(--ease), color .25s var(--ease); }
.find.editing [data-k], .find.editing [data-p] { cursor: text; }
.find.editing [data-k]:hover, .find.editing [data-p]:hover { background: rgba(0,0,0,.035); }
.find.editing [data-k]:focus, .find.editing [data-p]:focus { background: rgba(0,0,0,.05); color: var(--ink); }
.find.editing [data-k]:empty::before, .find.editing [data-p]:empty::before {
  content: attr(data-ph); color: var(--ink-2); opacity: .7;
}
.find:not(.editing) .when-editing { display: none; }
.find:not(.editing) [data-empty], .find:not(.editing) .summary-extra { display: none; }
.find.editing .sep { display: none; }
.find.editing .pname, .find.editing .meta { display: flex; flex-direction: column; gap: 2px; }
.find.editing details { pointer-events: none; }
.find.editing details > *:not(summary) { pointer-events: auto; }
.product { position: relative; }
.rm {
  all: unset; cursor: pointer; position: absolute; top: 0; right: 0;
  color: var(--ink-2); font-size: 14px; line-height: 1; padding: 2px 4px;
  opacity: 0; transition: opacity .25s var(--ease), color .25s var(--ease);
}
.product + .product .rm { top: 12px; }
.find.editing .product:hover .rm { opacity: 1; }
.rm:hover { color: var(--ink); }
.add {
  all: unset; cursor: pointer; align-self: flex-start; font-size: 12px;
  color: var(--ink-2); transition: color .25s var(--ease);
}
.add:hover { color: var(--ink); }
.shot-wrap { position: relative; }
.pimg, .pimg-slot {
  position: absolute; right: 10px; bottom: 10px; width: 30%; aspect-ratio: 1 / 1;
  border-radius: 14px; overflow: hidden;
}
.pimg {
  background: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.7), 0 8px 24px rgba(0,0,0,.14);
  animation: rise .5s var(--ease) both;
}
.pimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pimg-slot {
  display: grid; place-items: center; text-align: center; padding: 8px;
  font-size: 11px; line-height: 15px; color: var(--ink-2);
  background: color-mix(in srgb, var(--bg-a) 70%, transparent);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  opacity: 0; transition: opacity .3s var(--ease);
}
body.can-edit .find:hover .pimg-slot, body.can-edit .find.editing .pimg-slot { opacity: 1; }
body:not(.can-edit) .pimg-slot { display: none; }
.pimg-x {
  all: unset; position: absolute; top: 6px; right: 6px; cursor: pointer;
  width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center;
  font-size: 13px; color: var(--ink); background: rgba(255,255,255,.85);
  opacity: 0; transition: opacity .25s var(--ease);
}
body.can-edit .pimg:hover .pimg-x { opacity: 1; }
body:not(.can-edit) .pimg-x { display: none; }
.find.busy .pimg-slot, .find.busy .pimg { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.covers { padding: 12px 18px 0; display: flex; flex-direction: column; gap: 8px; }
.kicker { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.cover-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.cover-opt {
  all: unset; cursor: pointer; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden;
  background: var(--tile); box-shadow: inset 0 0 0 1px var(--line);
  opacity: .62; transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.cover-opt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover-opt:hover, .cover-opt.on { opacity: 1; }
.cover-opt.on { box-shadow: 0 0 0 1.5px var(--ink); }
.cover-opt:active { transform: scale(.98); }
.lines { display: flex; flex-direction: column; margin-top: 8px; }
.line {
  all: unset; cursor: pointer; display: grid; grid-template-columns: 38px 1fr; column-gap: 8px;
  padding: 6px 8px; margin: 0 -8px; border-radius: 10px; color: var(--ink-2);
  opacity: .5; transition: opacity .3s var(--ease), background .25s var(--ease), color .3s var(--ease);
}
.line:hover { background: rgba(0,0,0,.035); opacity: .85; }
.line.in { opacity: 1; color: var(--ink); }
.line.edge { background: rgba(0,0,0,.05); }
.ln-t { grid-row: span 2; font-size: 11px; color: var(--ink-2); padding-top: 1px; }
.ln-en { font-size: 13px; }
.ln-kr { font-family: var(--kr); font-size: 12px; color: var(--ink-2); }
.pill {
  all: unset; cursor: pointer; align-self: flex-start; margin-top: 10px; padding: 6px 14px;
  border-radius: 999px; font-size: 12px; color: var(--ink); background: var(--tile);
  transition: transform .2s var(--ease), background .25s var(--ease);
}
.pill:active { transform: scale(.98); }
.del {
  all: unset; cursor: pointer; align-self: flex-start; padding: 5px 12px; border-radius: 999px;
  font-size: 12px; color: rgba(160,60,60,.8); box-shadow: inset 0 0 0 1px rgba(160,60,60,.25);
  transition: box-shadow .25s var(--ease), color .25s var(--ease);
}
.del:hover { color: rgb(160,60,60); box-shadow: inset 0 0 0 1px rgba(160,60,60,.5); }
#status button {
  all: unset; cursor: pointer; margin-left: 12px; color: #fff; text-decoration: underline;
  text-underline-offset: 3px;
}
#status.act { pointer-events: auto; }
#status {
  position: fixed; left: 50%; bottom: 24px; z-index: 30;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
  padding: 8px 16px; border-radius: 999px; font-size: 12px; color: #f4f4f4;
  background: rgba(23,23,23,.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  transition: opacity .3s var(--ease), transform .45s var(--ease);
}
#status.on { opacity: 1; transform: translate(-50%, 0); }
.body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.product { display: flex; flex-direction: column; gap: 2px; }
.product + .product { padding-top: 12px; border-top: 1px solid var(--line); }
.pname { font-weight: 500; }
.orig { font-family: var(--kr); color: var(--ink-2); font-size: 13px; }
.meta { color: var(--ink-2); font-size: 12px; letter-spacing: .04em; }
.notes { margin: 4px 0 0; }
.product > .tags { margin: 8px 0 2px; }
.summary { color: var(--ink-2); margin: 0; }
details { color: var(--ink-2); font-size: 13px; }
summary {
  cursor: pointer; list-style: none; font-size: 12px; letter-spacing: .06em;
  text-transform: uppercase; transition: color .3s var(--ease);
}
summary::-webkit-details-marker { display: none; }
summary:hover, details[open] summary { color: var(--ink); }
details p { margin: 10px 0 0; }
details .src-label { display: block; margin-top: 12px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
details .kr { font-family: var(--kr); }
.foot {
  margin-top: auto; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding-top: 4px; font-size: 12px; color: var(--ink-2);
}
.foot .src { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.watch {
  flex: none; color: var(--ink); text-decoration: none; padding: 6px 12px;
  border-radius: 999px; background: var(--tile); transition: transform .2s var(--ease);
}
a.watch:active { transform: scale(.98); }
/* Where to buy: product pages on Olive Young (KR) and Daiso Mall */
.shops { display: flex; flex-wrap: wrap; gap: 6px; }
.shop { position: relative; display: inline-flex; }
a.shop-a {
  display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%;
  padding: 6px 12px; border-radius: 999px; background: var(--tile);
  font-size: 12px; line-height: 18px; color: var(--ink); text-decoration: none;
  transition: transform .2s var(--ease), background .25s var(--ease), padding .3s var(--ease);
}
a.shop-a:active { transform: scale(.98); }
a.shop-a .for { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 18ch; }
.find.editing .shop:hover a.shop-a { padding-right: 28px; }
.shop-x {
  all: unset; cursor: pointer; position: absolute; right: 9px; top: 50%; translate: 0 -50%;
  font-size: 13px; line-height: 1; color: var(--ink-2); opacity: 0;
  transition: opacity .25s var(--ease), color .25s var(--ease);
}
.find.editing .shop:hover .shop-x { opacity: 1; }
.shop-x:hover { color: var(--ink); }
.site-foot { display: flex; justify-content: center; padding: 0 16px calc(48px + env(safe-area-inset-bottom)); }
.site-foot[hidden] { display: none; }
.gh-btn {
  all: unset; cursor: pointer; font-size: 12px; color: var(--ink-2); padding: 4px 8px;
  transition: color .25s var(--ease);
}
.gh-btn:hover { color: var(--ink); }
.gh-sheet { gap: 12px; }
.gh-sheet p { margin: 0; font-size: 13px; color: var(--ink-2); }
.gh-sheet .pill { margin-top: 0; }
.empty { grid-column: 1/-1; color: var(--ink-2); padding: 60px 0; text-align: center; }
.again {
  all: unset; cursor: pointer; align-self: flex-start; margin-top: 2px;
  font-size: 12px; letter-spacing: .04em; color: var(--ink-2);
  transition: color .25s var(--ease);
}
.again:hover { color: var(--ink); }
.again::before { content: "↻ "; }
.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tags:not(:has(.tag)) { display: none; }
.find.editing .tags { display: flex; }
.tag {
  position: relative; display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 999px; background: var(--tile);
  font-size: 12px; line-height: 18px; color: var(--ink-2); cursor: pointer;
  transition: color .25s var(--ease), background .25s var(--ease), padding .3s var(--ease);
}
.tag:hover { color: var(--ink); }
button.tag { all: unset; position: relative; display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 999px; background: var(--tile); font-size: 12px; line-height: 18px;
  color: var(--ink-2); cursor: pointer; transition: color .25s var(--ease), box-shadow .3s var(--ease), transform .2s var(--ease); }
button.tag:hover { color: var(--ink); }
.tag.on { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.find.editing .cat-pill { display: none; }
/* The category shows as a pill; its text field only appears while editing. */
.find:not(.editing) [data-p="category"], .find:not(.editing) .meta .sep { display: none; }
.tag:active { transform: scale(.98); }
.find.editing .tag { cursor: text; }
.find.editing .tag:hover { padding-right: 24px; }
.find.editing .tag:focus-within { color: var(--ink); background: rgba(0,0,0,.07); }
.find.editing [data-tg] { outline: none; min-width: 1ch; }
.tag-x {
  all: unset; cursor: pointer; position: absolute; right: 7px; top: 50%;
  translate: 0 -50%; font-size: 13px; line-height: 1; color: var(--ink-2);
  opacity: 0; transition: opacity .25s var(--ease), color .25s var(--ease);
}
.find.editing .tag:hover .tag-x { opacity: 1; }
.tag-x:hover { color: var(--ink); }
.tag-in {
  all: unset; width: 7ch; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; line-height: 18px; color: var(--ink-2);
  box-shadow: inset 0 0 0 1px var(--line);
  transition: width .4s var(--ease), color .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease);
}
.tag-in::placeholder { color: var(--ink-2); }
.tag-in:focus { width: 14ch; color: var(--ink); background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 0 4px 14px rgba(0,0,0,.06); }
/* ---- Phone ---- */

how Lemon Sorbet was popular in the summer, right? I guess you could say this is like the non-pearl highlighter version of that. But I really like this glow it gives. I usually like to apply Glint’s Cotton Melt on my upper cheekbones, but maybe it’s because glowing blushes are trendy these days? I do apply it that way, but if I put on Cotton Melt after this, the tone stands out too much. I was looking for something suitable, and applying this was great because it didn't clash with the tone. Also, applying a matte, non-pearl product can feel a bit out of place with the glowing blush next to it, but since this has fine pearls inside, it gives a subtle glow that blends really well, which I like. Yes. If you’re just going to use it as a highlighter. I highly recommend against it; I’d suggest it for those who are into glowy makeup, and if I had to pick the best, it would definitely be the Butter Lemon Chip, which I talked about the most. If I had to choose from the colored ones, I’d go with Butter Cream Chip and Vanilla Chip", "translation_source": "YouTube auto-translation", "cover_options": [], "summary": "YuRia reviews the FWEE Cheek Chip in Baked Butter Lemon Chip, a subtle-shimmer highlighter that blends well with glowy blush, and names her favourite shades from the line.", "products": [{"brand": "FWEE (퓌)", "name": "Cheek Chip #Baked Butter Lemon Chip", "name_original": "퓌 치크칩 #베이크드 버터 레몬칩", "category": "cheek", "price": "", "notes": "A soft-glowing, near pearl-free highlighter for areas you want to look plumper. Its fine pearl gives a subtle glow that blends with glowy blush without clashing. It's her overall best pick from the line. The on-screen label says the product was provided."}], "cost_usd": 0.032956, "edited_at": "2026-11-06T11:50:03", "shop_links": [{"store": "oliveyoung", "url": "https://www.oliveyoung.co.kr/store/goods/getGoodsDetail.do?goodsNo=A000001001750", "name": "퓌 치크칩 기획/단품 (크림/베이크드/파우더)", "for": "Cheek Chip #Baked Butter Lemon Chip"}]}, {"id": let only = null;                  // ids of one group of repeats, from a card's note

// Tags and product categories share one list: the nav filters, the datalist.
function labels() {
  const seen = new Map();
  finds.forEach(f => {
    (f.tags || []).forEach(t => seen.set(t, 1));
    (f.products || []).forEach(p => p.category && seen.set(p.category, 1));
  });
  return [...seen.keys()];
}
function inCat(f, c) {
  return c === 'all' || (c === STAR ? !!f.starred : c === AGAIN ? !!repeats[f.id]
    : (f.tags || []).includes(c) || (f.products || []).some(p => p.category === c));
}
function categories() {
  return ['all', ...specials(), ...labels()];
}

function specials() {
  return [...(finds.some(f => f.starred) ? [STAR] : []), ...(Object.keys(repeats).length ? [AGAIN] : [])];
}

function haystack(f) {
  return [f.title, f.title_tab, f.channel, f.summary, f.captions, f.translation, ...(f.tags || []),
          ...(f.products || []).flatMap(p => [p.name, p.name_original, p.brand, p.category, p.notes])]
    .join(' ').toLowerCase();
}

// ---- Repeats: the same product, or the same moment, saved on more than one card ----
// Same product = same name (ignoring brackets, case, punctuation) and a brand in
// common, or no brand on either and the same video. Same moment = same video and
// overlapping spans.
const squash = s => s.replace(/[^\p{L}\p{N}]+/gu, '');
const pname = s => squash(String(s || '').toLowerCase().replace(/\([^)]*\)?/g, ' '));
const brands = b => { const s = String(b || '').toLowerCase();
  return [s.replace(/\([^)]*\)?/g, ' '), ...(s.match(/\([^)]*\)?/g) || [])].map(squash).filter(Boolean); };
function sameProduct(a, fa, b, fb) {
  const n = pname(a.name);
  if (!n || n !== pname(b.name)) return false;
  const ba = brands(a.brand), bb = brands(b.brand);
  return ba.length && bb.length ? ba.some(k => bb.includes(k))
    : !ba.length && !bb.length && fa.video_id === fb.video_id;
}
const spanEnd = f => Math.max(f.t, f.t_end || f.t);
const sameMoment = (a, b) => a.video_id === b.video_id && a.t <= spanEnd(b) && b.t <= spanEnd(a);

let repeats = {};                 // id -> {moment: [ids], products: {index: [ids]}}
function findRepeats() {
  repeats = {};
  const note = (f, kind, i, other) => {
    const r = repeats[f.id] ||= {moment: [], products: {}};
    const list = kind === 'moment' ? r.moment : (r.products[i] ||= []);
    if (!list.includes(other.id)) list.push(other.id);
  };
  finds.forEach((fa, x) => finds.slice(x + 1).forEach(fb => {
    if (sameMoment(fa, fb)) { note(fa, 'moment', 0, fb); note(fb, 'moment', 0, fa); }
    (fa.products || []).forEach((a, i) => (fb.products || []).forEach((b, j) => {
      if (sameProduct(a, fa, b, fb)) { note(fa, 'product', i, fb); note(fb, 'product', j, fa); }
    }));
  }));
}
function againHtml(f, others, what) {
  const days = others.map(id => byId(id)).filter(Boolean)
    .map(o => day(o.saved_at) + ' ' + clock(o.t)).join(', ');
  return `<button class="again" data-act="again" data-ids="${esc([f.id, ...others].join(' '))}"
    title="Show the cards with this ${what}">Found ${others.length + 1}× · also ${esc(days)}</button>`;
}

const SHOP_NAMES = {oliveyoung: 'Olive Young', daiso: 'Daiso'};
function shopsHtml(f) {
  const links = f.shop_links || [];
  if (!links.length) return '';
  const many = links.length > 1 || (f.products || []).length > 1;   // say which product
  return `<div class="shops">${links.map((s, i) => `<span class="shop">
    <a class="shop-a" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.name)}">${
      esc(SHOP_NAMES[s.store] || s.store)}${many && s.for ? `<span class="for">${esc(s.for)}</span>` : ''} ↗</a>
    <button class="shop-x when-editing" data-act="unshop" data-i="${i}" title="Remove link">×</button></span>`).join('')}</div>`;
}

const tagHtml = t => `<span class="tag" data-act="tag"><span data-tg>${esc(t)}</span><button class="tag-x when-editing" data-act="untag" title="Remove tag">×</button></span>`;
// Every label on a card as a pill: your tags (editable in Edit) and its products'
// categories (edited in the product fields, so hidden while editing). Click toggles the filter.
function tagsHtml(f) {
  const own = f.tags || [];
  const cats = [...new Set((f.products || []).map(p => p.category).filter(c => c && !own.includes(c)))];
  const on = t => !only && cat === t ? ' on' : '';
  return `<div class="tags">${ordered(own).map(t => tagHtml(t).replace('class="tag"', `class="tag${on(t)}"`)).join('')}${
    ordered(cats).map(c => `<button class="tag cat-pill${on(c)}" data-act="tag" data-c="${esc(c)}">${esc(c)}</button>`).join('')
  }<input class="tag-in when-editing" list="tag-list" placeholder="+ tag" aria-label="Add a tag" enterkeyhint="done"></div>`;
}

// One editable text slot. Empty slots are hidden unless the card is being edited.
const slot = (attr, key, value, ph, cls = '', tag = 'span') =>
  `<${tag} class="${cls}" ${attr}="${key}" data-ph="${esc(ph)}"${value ? '' : ' data-empty'}>${esc(value)}</${tag}>`;

function productHtml(p, i, f) {
  const both = (a, b) => a && b ? '<span class="sep"> · </span>' : '';
  const again = repeats[f.id]?.products[i];
  return `<div class="product" data-i="${i}">
    <button class="rm when-editing" title="Remove product" data-act="rm">×</button>
    <span class="pname">${slot('data-p', 'brand', p.brand, 'Brand')}${both(p.brand, p.name)}${slot('data-p', 'name', p.name, 'Product name')}</span>
    ${slot('data-p', 'name_original', p.name_original, 'Original name', 'orig')}
    <span class="meta">${slot('data-p', 'category', p.category, 'Category')}${both(p.category, p.price)}${slot('data-p', 'price', p.price, 'Price')}</span>
    ${i === 0 ? tagsHtml(f) : ''}
    ${slot('data-p', 'notes', p.notes, 'Notes', 'notes', 'p')}
    ${again ? againHtml(f, again, 'product') : ''}
  </div>`;
}

// The lines you recorded (inside f.keep), until you move the ends.
function selection(f) {
  if (trimSel.has(f.id)) return trimSel.get(f.id);
  const ts = f.lines.map(l => l.t);
  const inside = ts.filter(t => t >= f.keep[0] - 1 && t <= f.keep[1]);
  const near = t => ts.reduce((a, b) => Math.abs(b - t) < Math.abs(a - t) ? b : a);
  const sel = inside.length ? [inside[0], inside[inside.length - 1]] : [near(f.keep[0]), near(f.keep[0])];
  trimSel.set(f.id, sel);
  return sel;
}

function trimHtml(f) {
  const [a, b] = selection(f);
  const rows = f.lines.map(l => `<button class="line${l.t >= a && l.t <= b ? ' in' : ''}${l.t === a || l.t === b ? ' edge' : ''}" data-act="line" data-t="${l.t}">
      <span class="ln-t">${clock(l.t)}</span><span class="ln-en">${esc(l.en || '…')}</span><span class="ln-kr">${esc(l.text)}</span>
    </button>`).join('');
  return `<span class="src-label">Trim · tap the first and last line to keep</span>
    <div class="lines">${rows}</div>
    <button class="pill" data-act="trim">Keep ${clock(a)}–${clock(b)} · delete the rest</button>`;
}

function coversHtml(f) {
  return `<div class="covers"><span class="kicker">Pick a cover</span><div class="cover-row">${
    f.cover_options.map((p, i) => `<button class="cover-opt${p === f.shot ? ' on' : ''}" data-act="cover" data-i="${i}"><img src="${esc(p)}" alt="" loading="lazy"></button>`).join('')
  }</div></div>`;
}

const STAR_SVG = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.7l1.95 3.95 4.35.63-3.15 3.07.74 4.34L8 11.64l-3.89 2.05.74-4.34L1.7 6.28l4.35-.63z"/></svg>';
const starHtml = f => `<button class="star${f.starred ? ' on' : ''}" data-act="star" aria-pressed="${!!f.starred}" title="${f.starred ? 'Unstar' : 'Star'}">${STAR_SVG}</button>`;

function card(f) {
  const products = (f.products || []).map((p, i) => productHtml(p, i, f)).join('');
  const moment = repeats[f.id]?.moment;
  const span = clock(f.t) + (f.t_end > f.t ? '–' + clock(f.t_end) : '');
  return `<article class="find${editing.has(f.id) ? ' editing' : ''}${opened === f.id ? ' open' : ''}" data-id="${esc(f.id)}">
    <button class="edit-btn" data-act="edit">${editing.has(f.id) ? 'Done' : 'Edit'}</button>
    ${starHtml(f)}
    <div class="shot-wrap">
      <img class="shot" src="${esc(f.shot)}" alt="" loading="lazy">
      ${f.product_image
        ? `<div class="pimg"><img src="${esc(localImg.get(f.product_image) || f.product_image)}" alt="" onerror="this.onerror=null;this.src=this.src.replace('/products/','/uploads/')"><button class="pimg-x" data-act="unimg" title="Remove image">×</button></div>`
        : `<div class="pimg-slot">⌘V<br>product image</div>`}
    </div>
    ${editing.has(f.id) && (f.cover_options || []).length > 1 ? coversHtml(f) : ''}
    <div class="body">
      <div class="products">${products}</div>
      <button class="add when-editing" data-act="add">+ Add product</button>
      ${moment?.length ? againHtml(f, moment, 'moment') : ''}
      ${products ? '' : tagsHtml(f)}
      ${slot('data-k', 'summary', f.summary, 'Summary', 'summary' + (products ? ' summary-extra' : ''), 'p')}
      ${shopsHtml(f)}
      <details${editing.has(f.id) ? ' open' : ''}>
        <summary>What they said</summary>
        ${editing.has(f.id) && f.lines ? trimHtml(f) : `
        <span class="src-label">${esc(f.translation_source || 'Translation')}</span>
        ${slot('data-k', 'translation', f.translation, 'Translation', '', 'p')}
        <span class="src-label">Original${f.lang ? ' · ' + esc(f.lang) : ''}</span>
        ${slot('data-k', 'captions', f.captions, 'Original words', 'kr', 'p')}`}
      </details>
      <button class="del when-editing" data-act="del">Delete card</button>
      <div class="foot">
        <span class="src" title="${esc(f.title)}">${esc(day(f.saved_at))}${f.cost_usd ? ` · <span class="cost" title="What Claude cost for this card">${money(f.cost_usd)}</span>` : ''} · ${esc(f.channel || f.title)}</span>
        <a class="watch" href="${esc(f.link)}" target="_blank" rel="noopener">Watch ${span} ↗</a>
      </div>
    </div>
  </article>`;
}

function render() {
  findRepeats();
  const term = q.value.trim().toLowerCase();
  const shown = finds.filter(f => editing.has(f.id) ||
    ((only ? only.includes(f.id) : inCat(f, cat)) && (!term || haystack(f).includes(term))));
  grid.innerHTML = shown.length ? shown.map(card).join('')
    : `<p class="empty">${finds.length ? 'Nothing matches.' : 'No finds yet. Turn on REC (right-click the pet), then hold ⌥R on a YouTube video.'}</p>`;
  grid.querySelectorAll('.find.editing [data-k], .find.editing [data-p], .find.editing [data-tg]').forEach(el => {
    el.contentEditable = 'plaintext-only';
  });
  document.getElementById('tag-list').innerHTML = labels().map(t => `<option value="${esc(t)}">`).join('');
  document.getElementById('count').textContent = finds.length ? '· ' + finds.length : '';
  const spent = document.getElementById('spent');
  spent.textContent = usage.since ? money(usage.total) + ' spent since ' + day(usage.since) : '';
  spent.title = 'Every Claude call the pet has made since tracking began, including tests and deleted cards';
  // One button names the current filter; it opens the tag modal.
  const filtered = only || cat !== 'all';
  const hasTags = !!only || categories().length > 2;
  document.getElementById('tagbox').hidden = !hasTags;
  document.getElementById('catpill').innerHTML = hasTags
    ? `<button class="cat-btn" data-open aria-haspopup="dialog">${esc(only ? 'same item' : cat)}<span class="n">${shown.length}</span><span class="chev">▾</span></button>${
        filtered ? '<button class="cat-clear" data-c="all" aria-label="Show all" title="Show all">×</button>' : ''}`
    : '';
}

// ---- Editing (only when the pet serves this page) ----
let statusTimer;
function status(msg, ms = 1600, action) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.toggle('act', !!action);
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = () => { el.classList.remove('on', 'act'); action.run(); };
    el.append(b);
  }
  el.classList.add('on');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => el.classList.remove('on', 'act'), ms);
}

// ---- Delete: gone at once, Undo for a few seconds, then removed from disk ----
const UNDO_MS = 6000;
function commitDelete(id, keepalive = false) {
  const p = pendingDelete.get(id);
  if (!p) return;
  clearTimeout(p.timer);
  pendingDelete.delete(id);
  post('/api/finds/' + encodeURIComponent(id) + '/delete', {}, keepalive)
    .catch(() => status('Couldn’t delete. Is the pet running?', 3200));
}
function deleteCard(id) {
  const index = finds.findIndex(f => f.id === id);
  if (index < 0) return;
  const [find] = finds.splice(index, 1);
  editing.delete(id);
  pendingDelete.set(id, {find, index, timer: setTimeout(() => commitDelete(id), UNDO_MS)});
  render();
  status('Card deleted', UNDO_MS, {label: 'Undo', run: () => {
    const p = pendingDelete.get(id);
    if (!p) return;
    clearTimeout(p.timer);
    pendingDelete.delete(id);
    finds.splice(Math.min(p.index, finds.length), 0, p.find);
    render();
  }});
}
addEventListener('pagehide', () => [...pendingDelete.keys()].forEach(id => commitDelete(id, true)));

const byId = id => finds.find(f => f.id === id);
const text = el => (el ? el.textContent : '').replace(/ /g, ' ').trim();

function readCard(el) {
  const patch = {
    products: [...el.querySelectorAll('.product')].map(p =>
      Object.fromEntries(PRODUCT_FIELDS.map(k => [k, text(p.querySelector(`[data-p="${k}"]`))]))),
    tags: [...el.querySelectorAll('[data-tg]')].map(text).filter(Boolean),
  };
  el.querySelectorAll('[data-k]').forEach(n => { patch[n.dataset.k] = text(n); });
  return patch;
}

async function save(el) {
  const id = el.dataset.id, patch = readCard(el);
  Object.assign(byId(id), patch);
  try {
    Object.assign(byId(id), await post('/api/finds/' + encodeURIComponent(id), patch));
    status('Saved');
  } catch (e) {
    status('Couldn’t save. Is the pet running?', 3200);
  }
}

// ---- Phone: tap a card to open it (full width, all text); tap again to fold it ----
const phone = matchMedia('(max-width: 767px)');
let opened = null;
grid.addEventListener('click', e => {
  if (!phone.matches || e.target.closest('[data-act], a, button, summary, details, input, [contenteditable="plaintext-only"]')) return;
  const el = e.target.closest('.find');
  if (!el || el.classList.contains('editing')) return;
  const was = opened === el.dataset.id;
  grid.querySelector('.find.open')?.classList.remove('open');
  opened = was ? null : el.dataset.id;
  if (!was) el.classList.add('open');
  requestAnimationFrame(() => el.scrollIntoView({block: 'nearest', behavior: 'smooth'}));
});

grid.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const el = b.closest('.find'), id = el.dataset.id;
  if (b.dataset.act === 'again') {
    only = b.dataset.ids.split(' '); cat = 'all';
    render(); scrollTo({top: 0, behavior: 'smooth'});
  } else if (b.dataset.act === 'tag') {
    if (el.classList.contains('editing')) return;      // editing: the click places the caret
    const t = b.dataset.c || text(b.querySelector('[data-tg]'));
    const top = el.getBoundingClientRect().top;          // keep this card where it is
    only = null; cat = cat === t ? 'all' : t;            // click again to clear
    render();
    const again = grid.querySelector(`.find[data-id="${CSS.escape(id)}"]`);
    if (again) scrollBy(0, again.getBoundingClientRect().top - top);
  } else if (b.dataset.act === 'unshop') {
    const links = (byId(id).shop_links || []).filter((_, i) => i !== +b.dataset.i);
    byId(id).shop_links = links;
    b.closest('.shop').remove();
    post('/api/finds/' + encodeURIComponent(id), {shop_links: links})
      .then(f => { Object.assign(byId(id), f); status('Link removed'); })
      .catch(() => status('Couldn’t save. Is the pet running?', 3200));
  } else if (b.dataset.act === 'untag') {
    b.closest('.tag').remove(); save(el);
  } else if (b.dataset.act === 'edit') {
    if (editing.has(id)) { editing.delete(id); save(el); } else editing.add(id);
    render();
    if (editing.has(id)) grid.querySelector(`.find[data-id="${CSS.escape(id)}"] [data-p], .find[data-id="${CSS.escape(id)}"] [data-k]`)?.focus();
  } else if (b.dataset.act === 'add') {
    Object.assign(byId(id), readCard(el));
    byId(id).products.push({brand: '', name: '', name_original: '', category: '', price: '', notes: ''});
    render(); save(grid.querySelector(`.find[data-id="${CSS.escape(id)}"]`));
    grid.querySelector(`.find[data-id="${CSS.escape(id)}"] .product:last-child [data-p="name"]`)?.focus();
  } else if (b.dataset.act === 'star') {
    const on = !byId(id).starred;
    byId(id).starred = on;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
    b.title = on ? 'Unstar' : 'Star';
    post('/api/finds/' + encodeURIComponent(id), {starred: on})
      .then(() => status(on ? 'Starred' : 'Star removed'))
      .catch(() => status('Couldn’t save. Is the pet running?', 3200));
  } else if (b.dataset.act === 'rm') {
    const patch = readCard(el);           // the first product also holds the card's tags
    patch.products.splice(+b.closest('.product').dataset.i, 1);
    Object.assign(byId(id), patch);
    render(); save(grid.querySelector(`.find[data-id="${CSS.escape(id)}"]`));
  } else if (b.dataset.act === 'del') {
    deleteCard(id);
  } else if (b.dataset.act === 'line') {
    let [a, z] = selection(byId(id));
    const t = +b.dataset.t;
    if (t < a) a = t; else if (t > z) z = t;
    else if (t - a <= z - t) a = t; else z = t;
    trimSel.set(id, [a, z]);
    render();
  } else if (b.dataset.act === 'trim') {
    const [a, z] = selection(byId(id));
    post('/api/finds/' + encodeURIComponent(id) + '/trim', {start: a, end: z})
      .then(f => { finds[finds.findIndex(x => x.id === id)] = f; trimSel.delete(id); render(); status('Trimmed'); })
      .catch(() => status('Couldn’t trim. Is the pet running?', 3200));
  } else if (b.dataset.act === 'cover') {
    const i = +b.dataset.i;
    byId(id).shot = byId(id).cover_options[i];
    render();
    post('/api/finds/' + encodeURIComponent(id) + '/cover', {i})
      .then(f => { finds[finds.findIndex(x => x.id === id)] = f; render(); status('Cover saved'); })
      .catch(() => status('Couldn’t save the cover. Is the pet running?', 3200));
  } else if (b.dataset.act === 'unimg') {
    byId(id).product_image = '';
    post('/api/finds/' + encodeURIComponent(id), {product_image: ''})
      .then(f => { Object.assign(byId(id), f); status('Image removed'); })
      .catch(() => status('Couldn’t save. Is the pet running?', 3200));
    render();
  }
});
// ---- Product image: ⌘V an image over a card (hovered or being edited) ----
let hovered = null;
grid.addEventListener('mouseover', e => {
  hovered = e.target.closest('.find');
  const opt = e.target.closest('.cover-opt');
  const shot = hovered && hovered.querySelector('.shot');
  const f = hovered && byId(hovered.dataset.id);
  if (shot && f) {
    const want = opt ? opt.querySelector('img').getAttribute('src') : f.shot;
    if (shot.getAttribute('src') !== want) shot.setAttribute('src', want);
  }
});
grid.addEventListener('mouseleave', () => { hovered = null; });

function squareJpeg(blob, size = 480) {
  return createImageBitmap(blob).then(bmp => {
    const side = Math.min(bmp.width, bmp.height);     // centre crop to 1:1
    const c = document.createElement('canvas');
    c.width = c.height = Math.min(size, side);
    c.getContext('2d').drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2,
                                 side, side, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  });
}

// Every edit goes through post(): to the pet's server on the local page, or, on the
// website, into the repo's edits.json (the pet applies those when it next syncs).
async function post(url, body = {}, keepalive = false) {
  if (!GH) {
    const r = await fetch(url, {method: 'POST', keepalive,
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.status);
    return d;
  }
  if (url === '/api/upload') return {path: await upload(body.data)};
  const op = {id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
              t: Date.now(), path: url, body};
  myOps.push(op);
  keep('petfinds_ops', myOps);
  flushSoon();
  return applyOp(op);
}

// ---- The website: edits made here, shown at once and queued for the pet ----
const GH = location.hostname.endsWith('.github.io')
  ? {api: 'https://api.github.com', repo: location.hostname.split('.')[0] + '/' + location.pathname.split('/')[1]}
  : null;
const recall = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let token = GH ? recall('petfinds_gh_token', '') : '';
let myOps = GH ? recall('petfinds_ops', []) : [];       // this browser's edits, until the pet has them
const applied = new Set(JSON.parse(document.getElementById('applied').textContent));
const localImg = new Map();                             // uploaded image path -> data URL, this visit

// What the pet does with each edit, done here too so the page shows it straight away.
function applyOp({path, body}) {
  if (path === '/api/tag-order') { tagOrder = body.order; return {order: body.order}; }
  const m = path.match(/^\/api\/finds\/([\w-]+)(?:\/(\w+))?$/), f = m && byId(m[1]);
  if (!f) return m && m[2] === 'delete' ? {deleted: false} : {};
  if (m[2] === 'delete') { finds.splice(finds.indexOf(f), 1); return {deleted: true}; }
  if (m[2] === 'identify') return {find: f, filled: []};
  if (m[2] === 'cover') {
    const p = (f.cover_options || [])[body.i];
    if (p) { f.shot = p; f.cover_options = []; }
  } else if (m[2] === 'trim') {
    const lines = (f.lines || []).filter(l => body.start - 0.01 <= l.t && l.t <= body.end + 0.01);
    if (lines.length) {
      f.captions = lines.map(l => l.text).join(' ');
      const en = lines.map(l => l.en).filter(Boolean).join(' ');
      if (en) f.translation = en;
      f.t = Math.floor(lines[0].t); f.t_end = Math.floor(lines[lines.length - 1].t);
      f.link = `https://www.youtube.com/watch?v=${f.video_id}&t=${f.t}s`;
      delete f.lines; delete f.keep;
    }
  } else {
    Object.assign(f, body, body.tags ? {tags: [...new Set(body.tags.slice(0, 30).map(tagKey).filter(Boolean))]} : {});
  }
  return f;
}

async function gh(method, path, body) {
  const r = await fetch(`${GH.api}/repos/${GH.repo}${path ? '/' + path : ''}`, {method, cache: 'no-store',
    headers: {Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json',
              ...(body ? {'Content-Type': 'application/json'} : {})},
    body: body && JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401) signOut('Sign in again: GitHub didn’t accept the token');
    throw Object.assign(new Error(d.message || 'GitHub said ' + r.status), {status: r.status});
  }
  return d;
}
const toB64 = bytes => { let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); };
const fromB64 = s => Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0));

// Product images go to uploads/, named as the pet will name them in products/.
async function upload(dataUrl) {
  const data = dataUrl.split(',')[1], bytes = fromB64(data);
  const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-1', bytes))]
    .map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
  try { await gh('PUT', 'contents/uploads/' + hash + '.jpg', {message: 'Image from the website', content: data}); }
  catch (e) { if (e.status !== 422) throw e; }          // 422: that image is already there
  localImg.set('products/' + hash + '.jpg', dataUrl);
  return 'products/' + hash + '.jpg';
}

// Append unsent edits to edits.json; GitHub refuses a stale write (409), so read and try again.
let flushing = false, flushAgain = false, flushTimer;
function flushSoon() { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 300); }
async function flush() {
  if (!GH || !token || !myOps.some(o => !o.sent)) return;
  if (flushing) { flushAgain = true; return; }
  flushing = true;
  try {
    for (let tries = 0; tries < 6; tries++) {
      const out = myOps.filter(o => !o.sent);
      if (!out.length) break;
      let sha, list = [];
      try {
        const d = await gh('GET', 'contents/edits.json');
        sha = d.sha; list = JSON.parse(new TextDecoder().decode(fromB64(d.content || ''))) || [];
      } catch (e) { if (e.status !== 404) throw e; }
      const have = new Set(list.map(o => o.id));
      out.forEach(({id, t, path, body}) => have.has(id) || list.push({id, t, path, body}));
      try {
        await gh('PUT', 'contents/edits.json', {message: 'Edit from the website',
          content: toB64(new TextEncoder().encode(JSON.stringify(list, null, 1))), ...(sha ? {sha} : {})});
      } catch (e) { if (e.status === 409 || e.status === 422) continue; throw e; }
      out.forEach(o => { o.sent = true; });
      keep('petfinds_ops', myOps);
    }
  } catch (e) {
    status('Couldn’t save to GitHub (' + e.message + '). It tries again with your next edit.', 4200);
  } finally {
    flushing = false;
    if (flushAgain) { flushAgain = false; flushSoon(); }
  }
}

// Edits the pet hasn't applied yet (the site's edits.json, and this browser's own) go on
// top of the published data, in the order they were made.
async function replay() {
  myOps = myOps.filter(o => !o.sent || (!applied.has(o.id) && Date.now() - o.t < 3 * 864e5));
  keep('petfinds_ops', myOps);
  let remote = [];
  try {
    remote = token ? JSON.parse(new TextDecoder().decode(fromB64((await gh('GET', 'contents/edits.json')).content || '')))
      : await fetch('edits.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : []);
  } catch (e) {}
  const seen = new Set();
  const ops = [...(Array.isArray(remote) ? remote : []), ...myOps]
    .filter(o => o && !applied.has(o.id) && !seen.has(o.id) && seen.add(o.id)).sort((a, b) => a.t - b.t);
  if (!ops.length) return;
  finds.splice(0, finds.length, ...JSON.parse(document.getElementById('data').textContent));
  ops.forEach(applyOp);
  render();
}

const ghmodal = document.getElementById('ghmodal'), ghbtn = document.getElementById('ghbtn');
function signedIn(on) {
  canEdit = on;
  document.body.classList.toggle('can-edit', on);
  ghbtn.textContent = on ? 'Signed in to edit · sign out' : 'Sign in to edit';
  render();
}
function signOut(msg) {
  token = '';
  try { localStorage.removeItem('petfinds_gh_token'); } catch (e) {}
  editing.clear();
  signedIn(false);
  if (msg) status(msg, 3600);
}
function closeGh() {
  ghmodal.classList.remove('open');
  document.documentElement.style.overflow = '';
  setTimeout(() => { if (!ghmodal.classList.contains('open')) ghmodal.hidden = true; }, 400);
}
ghbtn.addEventListener('click', () => {
  if (token) return signOut('Signed out');
  ghmodal.hidden = false;
  document.documentElement.style.overflow = 'hidden';
  requestAnimationFrame(() => requestAnimationFrame(() => ghmodal.classList.add('open')));
  document.getElementById('ghtoken').focus();
});
ghmodal.addEventListener('click', e => { if (e.target === ghmodal) closeGh(); });
ghmodal.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); closeGh(); } });
ghmodal.querySelector('form').addEventListener('submit', async e => {
  e.preventDefault();
  const input = document.getElementById('ghtoken'), t = input.value.trim();
  if (!t) return;
  token = t;
  try {
    const repo = await gh('GET', '');
    if (repo.permissions && !repo.permissions.push) throw new Error('That token can’t write to ' + GH.repo);
  } catch (err) {
    token = '';
    return status(err.status === 401 ? 'GitHub didn’t accept that token' : err.message, 3600);
  }
  keep('petfinds_gh_token', t);
  input.value = '';
  closeGh();
  signedIn(true);
  status('Signed in. Edits here reach the pet when it next syncs.', 3200);
  flush();
});

function refresh(id) {
  const el = grid.querySelector(`.find[data-id="${CSS.escape(id)}"]`);
  if (el && el.classList.contains('editing')) Object.assign(byId(id), readCard(el), {products: byId(id).products});
  render();
}

async function setProductImage(id, blob) {
  const card = () => grid.querySelector(`.find[data-id="${CSS.escape(id)}"]`);
  card()?.classList.add('busy');
  try {
    const {path} = await post('/api/upload', {data: await squareJpeg(blob)});
    Object.assign(byId(id), await post('/api/finds/' + encodeURIComponent(id), {product_image: path}));
    refresh(id);
    if (GH) {
      post('/api/finds/' + encodeURIComponent(id) + '/identify', {});
      status('Image saved. The pet reads the packaging when it syncs.', 3200);
      return;
    }
    card()?.classList.add('busy');
    status('Reading the packaging…', 20000);
    const {find, filled} = await post('/api/finds/' + encodeURIComponent(id) + '/identify', {});
    Object.assign(byId(id), find);
    const p = (find.products || [])[0] || {};
    status(filled.length ? 'Added ' + [p.brand, p.name].filter(Boolean).join(' · ') : 'Image saved');
  } catch (e) {
    status('Couldn’t save the image: ' + e.message, 3600);
  }
  refresh(id);
}

document.addEventListener('paste', e => {
  if (!canEdit) return;
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  const el = document.activeElement?.closest?.('.find') || grid.querySelector('.find.editing') || hovered;
  if (!item || !el) return;         // plain text pastes behave as usual
  e.preventDefault();
  setProductImage(el.dataset.id, item.getAsFile());
});

// ---- Tags: type in "+ tag", Enter (or comma) adds it; edit a tag's text in place ----
const tagKey = t => t.replace(/#/g, ' ').toLowerCase().replace(/\s+/g, ' ').trim().slice(0, 40);
function addTag(input) {
  const t = tagKey(input.value), el = input.closest('.find');
  input.value = '';
  if (!t || readCard(el).tags.includes(t)) return false;
  input.insertAdjacentHTML('beforebegin', tagHtml(t));
  input.previousElementSibling.querySelector('[data-tg]').contentEditable = 'plaintext-only';
  save(el);
  return true;
}

// Picking a suggestion from the list adds it straight away.
grid.addEventListener('input', e => {
  if (e.target.matches('.tag-in') && (!e.inputType || e.inputType === 'insertReplacementText')) addTag(e.target);
});
grid.addEventListener('focusout', e => {
  if (e.target.matches('.tag-in')) { addTag(e.target); return; }
  const tg = e.target.closest('[data-tg]');
  if (tg && tg.closest('.find.editing')) {
    const t = tagKey(text(tg)), el = tg.closest('.find');
    tg.textContent = t;
    if (!t || readCard(el).tags.filter(x => x === t).length > 1) tg.closest('.tag').remove();
    save(el);
    return;
  }
  const n = e.target.closest('[data-k], [data-p]'), el = n && n.closest('.find.editing');
  if (el) { n.toggleAttribute('data-empty', !text(n)); save(el); }
});
grid.addEventListener('keydown', e => {
  if (e.target.matches('.tag-in')) {
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag(e.target); }
    else if (e.key === 'Backspace' && !e.target.value) {
      const last = e.target.previousElementSibling;
      if (last?.classList.contains('tag')) { last.remove(); save(e.target.closest('.find')); }
    }
    if (e.key === 'Escape') { e.target.value = ''; e.target.blur(); }
    return;
  }
  if (e.target.closest('[data-tg]') && e.key === 'Enter') { e.preventDefault(); e.target.blur(); return; }
  const n = e.target.closest('[data-p], [data-k="summary"]');
  if (n && e.key === 'Enter' && !e.shiftKey && n.tagName === 'SPAN') { e.preventDefault(); n.blur(); }
  if (e.key === 'Escape' && e.target.closest('.find.editing')) e.target.blur();
});

if (!GH && location.protocol.startsWith('http')) {
  fetch('/api/ping').then(r => r.ok && r.json()).then(d => {
    if (d && d.ok) { canEdit = true; document.body.classList.add('can-edit'); render(); }
  }).catch(() => {});
}

// ---- Tag modal ----
const modal = document.getElementById('tagmodal'), tq = document.getElementById('tq');
const tlist = document.getElementById('tlist');
let modalOpener = null;
function setCat(c) { only = null; cat = c; render(); scrollTo({top: 0, behavior: 'smooth'}); }
// Your order (tag_order.json) first, then anything new A–Z.
let tagOrder = JSON.parse(document.getElementById('order').textContent);
function ordered(list) {
  const rank = new Map(tagOrder.map((t, i) => [t, i]));
  const r = t => rank.has(t) ? rank.get(t) : Infinity;
  return list.slice().sort((a, b) => (r(a) - r(b)) || a.localeCompare(b));
}
function drawTags() {
  const term = tq.value.trim().toLowerCase();
  const n = c => finds.filter(f => inCat(f, c)).length;
  const sortable = canEdit && !term;
  const chip = (c, drag) => `<button class="tchip${!only && c === cat ? ' on' : ''}" data-c="${esc(c)}"${
    drag && sortable ? ' data-drag title="Drag to reorder"' : ''}>${esc(c)}<span class="n">${n(c)}</span></button>`;
  const pick = list => ordered(list.filter(c => !term || c.toLowerCase().includes(term)));
  const own = new Set(finds.flatMap(f => f.tags || []));
  const groups = [
    ['', ['all', ...specials()].filter(c => !term || c.includes(term))],
    ['Tags', pick([...own])],
    ['Categories', pick(labels().filter(c => !own.has(c)))],
  ].filter(([, list]) => list.length);
  const az = list => sortable && list.join('\n') !== list.slice().sort((a, b) => a.localeCompare(b)).join('\n');
  tlist.innerHTML = groups.length ? groups.map(([name, list]) =>
    `<div class="tgroup">${name ? `<div class="thead"><span class="kicker">${name}</span>${
      az(list) ? '<button class="t-az" data-az>A–Z</button>' : ''}</div>` : ''}<div class="tchips">${
      list.map(c => chip(c, !!name)).join('')}</div></div>`).join('')
    : '<p class="tnone">No tags match.</p>';
}

function saveOrder(order, msg, undo) {
  const before = tagOrder;
  tagOrder = order;
  post('/api/tag-order', {order})
    .then(d => { tagOrder = d.order; status(msg, undo ? 6000 : 1600, undo && {label: 'Undo', run: () => {
      saveOrder(before, 'Order restored'); drawTags(); }}); })
    .catch(() => { tagOrder = before; drawTags(); status('Couldn’t save the order. Is the pet running?', 3200); });
}
// The chips' order on screen, merged into the saved order (labels not shown keep their place).
function domOrder() {
  const shown = [...tlist.querySelectorAll('.tchip[data-drag]')].map(c => c.dataset.c);
  return [...shown, ...tagOrder.filter(t => !shown.includes(t))];
}

// ---- Drag to reorder: press and move (on touch, hold first). Live reorder with a slide. ----
let drag = null, swallowClick = false;
function slide(group, change) {
  const chips = [...group.children], before = new Map(chips.map(c => [c, c.getBoundingClientRect()]));
  change();
  chips.forEach(c => {
    const a = before.get(c), b = c.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (dx || dy) c.animate([{transform: `translate(${dx}px, ${dy}px)`}, {transform: 'none'}],
      {duration: 380, easing: 'cubic-bezier(0.16, 1, 0.3, 1)'});
  });
}
function startDrag() {
  drag.on = true;
  drag.c.classList.add('dragging');
  document.documentElement.classList.add('sorting');
}
function endDrag() {
  if (!drag) return;
  clearTimeout(drag.timer);
  if (drag.on) {
    drag.c.classList.remove('dragging');
    document.documentElement.classList.remove('sorting');
    swallowClick = true; setTimeout(() => { swallowClick = false; }, 0);
    const order = domOrder();
    if (order.join('\n') !== drag.start.join('\n')) saveOrder(order, 'Order saved');
    drawTags();
  }
  drag = null;
}
tlist.addEventListener('pointerdown', e => {
  const c = e.target.closest('.tchip[data-drag]');
  if (!c || e.button !== 0) return;
  drag = {c, x: e.clientX, y: e.clientY, on: false, touch: e.pointerType !== 'mouse', start: domOrder(), last: null};
  if (drag.touch) drag.timer = setTimeout(() => drag && startDrag(), 280);
});
addEventListener('pointermove', e => {
  if (!drag) return;
  const moved = Math.hypot(e.clientX - drag.x, e.clientY - drag.y);
  if (!drag.on) {
    if (drag.touch) { if (moved > 8) endDrag(); return; }     // a swipe: let the list scroll
    if (moved < 4) return;
    startDrag();
  }
  const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.tchip[data-drag]');
  if (!over || over === drag.c) { drag.last = null; return; }
  if (over === drag.last || over.parentElement !== drag.c.parentElement) return;
  const kids = [...over.parentElement.children];
  const after = kids.indexOf(over) > kids.indexOf(drag.c);
  drag.last = over;                      // don't swap back while still over it
  slide(over.parentElement, () => over.parentElement.insertBefore(drag.c, after ? over.nextSibling : over));
});
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
// Once a hold has picked a chip up, stop the finger from scrolling the list.
tlist.addEventListener('touchmove', e => { if (drag?.on) e.preventDefault(); }, {passive: false});
tlist.addEventListener('contextmenu', e => { if (drag) e.preventDefault(); });
function openTags() {
  // Opened from the tag field, focus goes back to the pill so closing doesn't reopen it.
  modalOpener = document.activeElement === tagq ? cats.querySelector('.cat-btn') : document.activeElement;
  tq.value = ''; drawTags();
  modal.hidden = false;
  document.documentElement.style.overflow = 'hidden';
  requestAnimationFrame(() => requestAnimationFrame(() => modal.classList.add('open')));
  tq.focus();
}
function closeTags() {
  if (modal.hidden) return;
  modal.classList.remove('open');
  document.documentElement.style.overflow = '';
  setTimeout(() => { if (!modal.classList.contains('open')) modal.hidden = true; }, 400);
  modalOpener?.focus?.({preventScroll: true});
}
// ---- Phone: 1, 2 or 3 cards per row (remembered on this device) ----
const colseg = document.getElementById('colseg');
function setCols(n) {
  n = [1, 2, 3].includes(+n) ? +n : 2;
  document.documentElement.dataset.cols = n;
  try { localStorage.setItem('petfinds_cols', n); } catch (e) {}
  colseg.querySelectorAll('[data-cols]').forEach(b => b.classList.toggle('on', +b.dataset.cols === n));
}
setCols(document.documentElement.dataset.cols);

cats.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.cols) return setCols(b.dataset.cols);
  if (b.hasAttribute('data-open')) openTags(); else setCat(b.dataset.c);
});
modal.addEventListener('click', e => {
  if (e.target === modal) return closeTags();
  if (swallowClick) return;                       // the end of a drag, not a pick
  if (e.target.closest('[data-az]')) {
    const names = [...e.target.closest('.tgroup').querySelectorAll('.tchip[data-drag]')].map(c => c.dataset.c);
    saveOrder(tagOrder.filter(t => !names.includes(t)), 'Sorted A–Z', true);
    drawTags();
    return;
  }
  const c = e.target.closest('.tchip');
  if (c) { closeTags(); setCat(c.dataset.c); }
});
tq.addEventListener('input', drawTags);
modal.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeTags(); }
  if (e.key === 'Enter' && e.target === tq && tq.value.trim()) {
    const first = tlist.querySelector('.tchip[data-c]:not([data-c="all"])') || tlist.querySelector('.tchip');
    if (first) { e.preventDefault(); closeTags(); setCat(first.dataset.c); }
  }
});
q.addEventListener('input', render);
// "search tags" beside the pill opens the tag modal with the caret in its search.
const tagq = document.getElementById('tagq');
tagq.addEventListener('focus', () => { tagq.value = ''; openTags(); });
let lastY = 0;
const bar = document.getElementById('bar');
addEventListener('scroll', () => {
  const y = scrollY;
  if (Math.abs(y - lastY) < 8) return;
  bar.classList.toggle('hide', y > lastY && y > 80);
  lastY = y;
}, {passive: true});

render();
if (GH) {
  document.getElementById('sitefoot').hidden = false;
  signedIn(!!token);
  replay().then(flush);
}
</script>
